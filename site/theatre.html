<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>井冈山 · 3D剧场 Alpha（WP04）</title>
<link rel="stylesheet" href="assets/maplibre-gl.css">
<style>
:root{
  --paper:#f5efe0; --paper2:#efe6d0; --ink:#2b2420; --ink2:#5a4f45;
  --cinnabar:#b03a2e; --gold:#a8842c; --border:#d8cbaa;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;display:flex;flex-direction:column}
header{flex:0 0 auto;padding:8px 16px;border-bottom:2px solid var(--cinnabar);display:flex;align-items:center;gap:14px;background:rgba(245,239,224,.97);z-index:10}
header h1{font-size:16px;letter-spacing:3px}
header .tag{font-size:11px;color:#fff;background:var(--gold);border-radius:9px;padding:2px 9px;letter-spacing:1px}
header a.back{margin-left:auto;font-size:12px;color:var(--cinnabar);text-decoration:none;border:1px solid var(--border);border-radius:13px;padding:4px 12px;background:rgba(255,252,243,.8)}
main{flex:1 1 auto;position:relative}
#stage{position:absolute;inset:0}
/* scene caption card */
.sceneCard{position:absolute;left:12px;top:12px;z-index:5;max-width:360px;background:rgba(255,252,243,.95);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:0 3px 14px rgba(60,45,30,.18)}
.sceneCard .scNo{font-size:11px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.sceneCard h3{font-size:17px;color:var(--cinnabar);letter-spacing:2px;margin-bottom:8px}
.sceneCard .cap{font-size:13px;line-height:1.9;color:var(--ink2);letter-spacing:.5px}
.sceneCard .src{margin-top:10px;font-size:11px;color:var(--ink2);border-top:1px dashed var(--border);padding-top:8px;line-height:1.8}
.sceneCard .src b{color:var(--ink)}
.sceneCard .art{display:inline-block;margin-top:10px;font-size:12.5px;color:#fff;background:var(--cinnabar);border-radius:13px;padding:5px 16px;text-decoration:none;letter-spacing:1px}
.sceneCard .art:hover{background:#8e2f26}
.sceneCard .draftNote{margin-top:8px;font-size:10.5px;color:var(--gold)}
/* playbar */
.playbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;background:rgba(255,252,243,.95);border:1px solid var(--border);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(60,45,30,.18)}
.playbar button{font-family:inherit;font-size:12.5px;padding:4px 14px;border-radius:13px;border:1px solid var(--cinnabar);background:rgba(176,58,46,.06);color:var(--cinnabar);cursor:pointer;letter-spacing:1px}
.playbar button:hover{background:var(--cinnabar);color:#fff}
.playbar .st{font-size:12.5px;color:var(--ink);letter-spacing:1px}
.playbar .dots{display:flex;gap:7px;margin-left:8px}
.playbar .dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--cinnabar);cursor:pointer}
.playbar .dots i.on{background:var(--cinnabar)}
#status{position:absolute;right:12px;top:12px;z-index:5;background:rgba(43,36,32,.9);color:#f5efe0;font-size:11.5px;border-radius:8px;padding:8px 12px;letter-spacing:.5px;line-height:1.7;max-width:260px}
/* no-WebGL fallback: equivalent reading view */
#fallback{display:none;position:absolute;inset:0;overflow:auto;padding:24px;z-index:8;background:var(--paper)}
#fallback .fbWrap{max-width:760px;margin:0 auto}
#fallback h2{font-size:18px;color:var(--cinnabar);letter-spacing:2px;margin-bottom:6px}
#fallback .note{font-size:12px;color:var(--ink2);margin-bottom:18px}
#fallback .fbCard{background:rgba(255,252,243,.95);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px}
#fallback .fbCard .scNo{font-size:11px;color:var(--gold);letter-spacing:2px}
#fallback .fbCard h3{font-size:16px;color:var(--cinnabar);letter-spacing:2px;margin:4px 0 8px}
#fallback .fbCard p{font-size:13px;line-height:1.9;color:var(--ink2)}
#fallback .fbCard a{display:inline-block;margin-top:8px;font-size:12.5px;color:#fff;background:var(--cinnabar);border-radius:13px;padding:5px 16px;text-decoration:none}
.attn{position:absolute;right:12px;bottom:64px;z-index:4;font-size:10px;color:var(--ink2);background:rgba(245,239,224,.85);border-radius:6px;padding:4px 8px;letter-spacing:.5px}
</style>
</head>
<body>
<header>
  <h1>井冈山 · 3D剧场</h1><span class="tag">Alpha · 依据两篇原文</span>
  <a class="back" href="index.html#/view/map">← 返回图集</a>
</header>
<main>
  <div id="stage"></div>
  <div class="sceneCard" id="sceneCard" style="display:none">
    <div class="scNo" id="scNo"></div>
    <h3 id="scTitle"></h3>
    <div class="cap" id="scCap"></div>
    <div class="src" id="scSrc"></div>
    <a class="art" id="scArt" style="display:none">打开本幕文章 →</a>
    <div class="draftNote">镜头运动属视觉表达，非史实证明；幕内容以文章原文为据。</div>
  </div>
  <div class="playbar">
    <button id="prevBtn">◀ 上一幕</button>
    <button id="playBtn">▶ 播放</button>
    <button id="nextBtn">下一幕 ▶</button>
    <button id="askBtn" style="border-color:var(--gold);color:var(--gold)">就此幕提问 →</button>
    <span class="dots" id="dots"></span>
    <span class="st" id="sceneLab"></span>
  </div>
  <div id="status">加载中…</div>
  <div id="fallback">
    <div class="fbWrap">
      <h2>井冈山 · 剧场（文字版）</h2>
      <div class="note">当前设备不支持三维渲染，已切换为等价查阅视图。各幕说明与文章入口如下。</div>
      <div id="fbList"></div>
    </div>
  </div>
  <div class="attn" style="display:none" id="attn">DEM: AWS Terrain Tiles (Mapzen terrarium) · 底图: CARTO © OpenStreetMap contributors</div>
</main>
<script src="assets/maplibre-gl.js"></script>
<script>
/* WP04 theatre alpha - config-driven 3-act TopicScene player.
   Data: data/sample-topic.json (WP03). Camera params are visual expression, not proof.
   ASCII-only identifiers; UI strings via \u escapes where quoted. */
(function(){
"use strict";
var st = document.getElementById("status");
function log(s){ st.textContent = s; }
function el(id){ return document.getElementById(id); }

var T = null;                 /* sample-topic.json */
var ART_TITLES = {};          /* articleId -> title */
var player = {mode:"idle", idx:0, timer:null};   /* idle|playing|paused|finished */
var HOLD_MS = 6500;
var map = null, failed = false, loaded = false;

/* ---------- boot ---------- */
fetch("data/sample-topic.json").then(function(r){
  if(!r.ok) throw new Error("sample-topic.json " + r.status);
  return r.json();
}).then(function(d){
  T = d;
  Object.keys(d.articles).forEach(function(aid){ ART_TITLES[aid] = d.articles[aid].title; });
  buildDots();
  /* WP06: ?scene=<sceneId> 或 sessionStorage.jgs_scene → 恢复上次的幕次 (不自动播放) */
  var startIdx = 0;
  try{
    var qs = new URLSearchParams(location.search).get("scene");
    var sid = qs || sessionStorage.getItem("jgs_scene");
    if(sid){
      var k = scenes().findIndex(function(s){ return s.sceneId === sid; });
      if(k >= 0) startIdx = k;
    }
  }catch(e){}
  renderScene(startIdx, false);
  if(!window.maplibregl){ fallback("三维组件未就绪，已切换文字版"); return; }
  initMap();
}).catch(function(e){
  fallback("数据包加载失败，已切换文字版（" + (e && e.message || e) + "）");
});

function initMap(){
  var DEM_URL = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
  var BASE_URL = "https://basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}.png";
  var LABEL_URL = "https://basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}.png";
  /* MAP01/MAP02: record engine version + container size + WebGL support; keep failure readable */
  var stageEl = document.getElementById("stage");
  var libVer = (window.maplibregl && maplibregl.version) || "unknown";
  var box = stageEl ? (stageEl.clientWidth + "x" + stageEl.clientHeight) : "missing";
  var webglOk = false, webglMsg = "";
  try{
    var cv = document.createElement("canvas");
    var gl = cv.getContext("webgl2") || cv.getContext("webgl");
    if(gl){ webglOk = true; }
    else { webglMsg = "WebGL context unavailable"; }
  }catch(e){ webglMsg = (e && e.name ? e.name + ": " : "") + (e && e.message ? e.message : String(e)); }
  if(!webglOk){ fallback("三维初始化失败 · " + webglMsg + " · lib=" + libVer + " · 容器=" + box); return; }
  try{
    map = new maplibregl.Map({
      container:"stage",
      style:{
        version:8,
        sources:{
          base:{type:"raster", tiles:[BASE_URL], tileSize:256, maxzoom:10,
            attribution:"\u00a9 OpenStreetMap contributors \u00a9 CARTO \u00b7 DEM: Mapzen/AWS"},
          labels:{type:"raster", tiles:[LABEL_URL], tileSize:256, maxzoom:10},
          dem:{type:"raster-dem", tiles:[DEM_URL], encoding:"terrarium", tileSize:256, maxzoom:13}
        },
        layers:[
          {id:"base", type:"raster", source:"base", paint:{"raster-opacity":0.94}},
          {id:"dem-shade", type:"hillshade", source:"dem", paint:{
            "hillshade-exaggeration":0.45, "hillshade-shadow-color":"#6b5d3f",
            "hillshade-highlight-color":"#fff8e8", "hillshade-accent-color":"#c9b98d"}},
          {id:"labels", type:"raster", source:"labels", paint:{"raster-opacity":0.85}}
        ]
      },
      center:[114.163, 26.575], zoom:9.8, pitch:60, bearing:-20,
      maxZoom:13, attributionControl:{compact:true}
    });
  }catch(e){
    var m = (e && e.name ? e.name + ": " : "") + (e && e.message ? e.message : String(e));
    fallback("三维初始化失败 · " + m + " · lib=" + libVer + " · 容器=" + box);
    return;
  }
  window.__theatreMap = map;
  map.on("error", function(e){
    var msg = (e && e.error && e.error.message) || "";
    if(/WebGL|context|shader/i.test(msg)) fallback("三维渲染不可用，已切换文字版");
  });
  map.on("load", function(){
    loaded = true;
    map.setTerrain({source:"dem", exaggeration:1.0});
    addSceneLayers();
    log("三维就绪 \u00b7 共 " + T.topic.scenes.length + " 幕");
    el("attn").style.display = "block";
    /* WP06+: 恢复用户上次手动调整的相机 (优先于场景默认); 无则飞向当前幕 */
    var uc = null;
    try{
      var savedCam = JSON.parse(sessionStorage.getItem("jgs_cam") || "null");
      if(savedCam && savedCam.cam && typeof savedCam.cam.lng === "number") uc = savedCam.cam;
    }catch(e){}
    if(uc){
      map.jumpTo({ center:[uc.lng, uc.lat], zoom:uc.zoom, pitch:uc.pitch, bearing:uc.bearing });
      log("已恢复上次视角 · 第 " + (player.idx+1) + " 幕");
    } else {
      flyScene(player.idx, 0);
    }
  });
  map.on("dragstart", function(){ if(player.mode === "playing") pausePlayer(); });
  /* WP06+: 用户手动调整相机 → 记录, 返回剧场时可还原 */
  map.on("moveend", function(){
    if(failed || !map) return;
    try{
      var c = map.getCenter();
      player.userCam = { lng: c.lng, lat: c.lat, zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing() };
      /* 立即持久化 (而非等切幕): 拖动相机后直接进研究室也能恢复最新视角;
         绑定专题+当前幕次, 避免不同专题/幕次间串号 */
      sessionStorage.setItem("jgs_cam", JSON.stringify({
        topic: (T && T.topic && T.topic.topicId) || "default",
        scene: (scenes()[player.idx] && scenes()[player.idx].sceneId) || null,
        cam: player.userCam,
      }));
    }catch(e){}
  });
}

function placeById(pid){
  var r = null;
  T.places.forEach(function(p){ if(p.placeId === pid) r = p; });
  return r;
}

function addSceneLayers(){
  /* places as stops (from topic config, ids resolved) */
  var feats = [];
  T.topic.scenes.forEach(function(sc){
    (sc.placeIds || []).forEach(function(pid){
      var p = placeById(pid);
      if(p && p.lat != null) feats.push({type:"Feature",
        properties:{name:p.name, pid:pid},
        geometry:{type:"Point", coordinates:[p.lng, p.lat]}});
    });
  });
  map.addSource("places", {type:"geojson",
    data:{type:"FeatureCollection", features:feats}});
  map.addLayer({id:"place-halo", type:"circle", source:"places", paint:{
    "circle-radius":12, "circle-color":"rgba(176,58,46,.20)",
    "circle-stroke-width":2, "circle-stroke-color":"#8e2f26"}});
  map.addLayer({id:"place-core", type:"circle", source:"places", paint:{
    "circle-radius":5, "circle-color":"#f5efe0",
    "circle-stroke-width":2.4, "circle-stroke-color":"#8e2f26"}});
  /* DOM labels: no glyph dependency */
  var seen = {};
  feats.forEach(function(f){
    if(seen[f.properties.pid]) return;
    seen[f.properties.pid] = 1;
    var d = document.createElement("div");
    d.className = "mx3d-stoplab";
    d.textContent = f.properties.name;
    d.addEventListener("click", function(ev){
      ev.stopPropagation();
      jumpToPlace(f.properties.pid);
    });
    new maplibregl.Marker({element:d, anchor:"top", offset:[0,10]})
      .setLngLat(f.geometry.coordinates).addTo(map);
  });
}

function jumpToPlace(pid){
  var p = placeById(pid);
  if(p && p.lat != null){
    map.flyTo({center:[p.lng, p.lat], zoom:11.2, pitch:58, bearing:10, duration:1600});
  }
}

/* ---------- scene rendering ---------- */
function scenes(){ return T.topic.scenes; }

function renderScene(i, fly){
  var sc = scenes()[i];
  if(!sc) return;
  player.idx = i;
  /* WP06: 记录当前幕, 供"返回剧场"刷新兜底恢复 */
  try{ sessionStorage.setItem("jgs_scene", sc.sceneId); }catch(e){}
  el("scNo").textContent = "\u7b2c " + (i+1) + " \u5e55 / \u5171 " + scenes().length + " \u5e55";
  el("scTitle").textContent = sc.title;
  el("scCap").textContent = sc.caption;
  /* source line: article title + topic time range */
  var srcHtml = "";
  if(sc.articleId && ART_TITLES[sc.articleId]){
    srcHtml += "<b>\u4f9d\u636e</b>\uff1a" + ART_TITLES[sc.articleId];
    var a = T.articles[sc.articleId];
    if(a && a.date && a.date.raw) srcHtml += " " + a.date.raw.replace(/^\uff08|\uff09$/g, "");
  } else {
    srcHtml += "<b>\u4f9d\u636e</b>\uff1a\u672c\u4e13\u9898\u914d\u7f6e\uff08\u672a\u7ed1\u5b9a\u5177\u4f53\u6bb5\u843d\uff0c\u5f85 WP06 \u8054\u52a8\uff09";
  }
  srcHtml += "<br><b>\u65f6\u6bb5</b>\uff1a" + T.topic.timeRange.start + " \u2014 " + T.topic.timeRange.end;
  el("scSrc").innerHTML = srcHtml;
  var art = el("scArt");
  if(sc.articleId){
    art.style.display = "inline-block";
    /* WP06: 段落级深链 — 场景绑定了 paragraphId 时直达该段并高亮 */
    art.href = "index.html#/art/" + sc.articleId + (sc.paragraphId ? "/" + sc.paragraphId : "");
    art.textContent = "\u6253\u5f00\u300a" + ART_TITLES[sc.articleId] + "\u300b" + (sc.paragraphId ? "\u5bf9\u5e94\u6bb5\u843d \u2192" : " \u2192");
  } else { art.style.display = "none"; }
  el("sceneLab").textContent = (i+1) + "/" + scenes().length + " " + sc.title;
  var dots = el("dots").children;
  for(var k = 0; k < dots.length; k++) dots[k].className = (k === i) ? "on" : "";
  el("sceneCard").style.display = "block";
  if(fly !== false && loaded && !failed) flyScene(i, 2400);
}

function flyScene(i, dur){
  var sc = scenes()[i];
  if(!sc || !sc.camera) return;
  var cam = {center:sc.camera.center, zoom:sc.camera.zoom,
             pitch:sc.camera.pitch, bearing:sc.camera.bearing,
             duration:dur || 2400};
  if(sc.camera.flyTo) map.flyTo(cam); else map.easeTo(cam);
}

/* ---------- player ---------- */
function playPlayer(){
  if(player.mode === "finished" || player.idx >= scenes().length) player.idx = 0;
  player.mode = "playing";
  playBtnUI();
  stepScene();
}
function stepScene(){
  if(player.mode !== "playing") return;
  if(player.idx >= scenes().length){
    player.mode = "finished"; playBtnUI();
    log("\u5267\u573a\u64ad\u653e\u7ed3\u675f");
    return;
  }
  renderScene(player.idx, true);
  player.idx++;
  player.timer = setTimeout(stepScene, (loaded && !failed ? 2400 : 0) + HOLD_MS);
}
function pausePlayer(){
  if(player.timer){ clearTimeout(player.timer); player.timer = null; }
  if(player.mode === "playing") player.mode = "paused";
  playBtnUI();
}
// 离页/切后台 → 暂停播放计时器 (WP06 验收点)
document.addEventListener("visibilitychange", function(){
  if(document.hidden && player.timer) pausePlayer();
});
function togglePlayer(){
  if(player.mode === "playing") pausePlayer();
  else { playPlayer(); }
}
function playBtnUI(){
  el("playBtn").textContent = player.mode === "playing" ? "\u275a\u275a \u6682\u505c" : "\u25b6 \u64ad\u653e";
}
el("playBtn").onclick = togglePlayer;
el("prevBtn").onclick = function(){
  pausePlayer();
  var i = player.idx > 0 ? player.idx - 1 : 0;
  renderScene(i, true);
};
el("nextBtn").onclick = function(){  pausePlayer();
  var i = player.idx < scenes().length - 1 ? player.idx + 1 : scenes().length - 1;
  renderScene(i, true);
};
/* WP08 联动: 就此幕提问 → 研究室带研究范围(本幕文章)与返回路径(from=scene:<sceneId>) */
el("askBtn").onclick = function(){
  pausePlayer();
  var sc = scenes()[player.idx];
  if(!sc) return;
  var arts = [];
  if(sc.articleId) arts.push(sc.articleId);
  (sc.evidenceIds || []).forEach(function(eid){ var m = /^p(v\d+n\d+)-/.exec(eid); if(m && arts.indexOf(m[1])<0) arts.push(m[1]); });
  var url = "research.html?from=scene:" + encodeURIComponent(sc.sceneId);
  if(arts.length) url += "&art=" + arts.join(",");
  location.href = url;
};

function buildDots(){
  var box = el("dots");
  box.innerHTML = "";
  scenes().forEach(function(sc, i){
    var d = document.createElement("i");
    d.title = sc.title;
    d.onclick = function(){ pausePlayer(); renderScene(i, true); };
    box.appendChild(d);
  });
}

/* ---------- fallback: equivalent reading view (no WebGL) ---------- */
function fallback(msg){
  if(failed) return;
  failed = true;
  if(player.timer){ clearTimeout(player.timer); player.timer = null; }
  try{ if(map) map.remove(); }catch(e){}
  map = null;
  log(msg);
  /* MAP01: surface the exact failure reason in the fallback view (copyable) */
  var note = document.querySelector("#fallback .note");
  if(note){
    var d = document.createElement("div");
    d.style.cssText = "margin-top:8px;font-size:11px;color:#b03a2e;user-select:all;word-break:break-all";
    d.textContent = "诊断：" + (msg || "");
    note.appendChild(d);
  }
  var fb = el("fallback");
  fb.style.display = "block";
  el("sceneCard").style.display = "none";
  document.querySelector(".playbar").style.display = "none";
  var list = el("fbList");
  list.innerHTML = "";
  scenes().forEach(function(sc, i){
    var c = document.createElement("div");
    c.className = "fbCard";
    var src = sc.articleId ? "\u4f9d\u636e\uff1a" + ART_TITLES[sc.articleId] : "";
    c.innerHTML = "<div class='scNo'>\u7b2c " + (i+1) + " \u5e55</div><h3></h3><p></p>" +
      (sc.articleId ? "<a href='index.html#/art/" + sc.articleId + (sc.paragraphId ? "/" + sc.paragraphId : "") + "'>\u6253\u5f00\u539f\u6587 \u2192</a>" : "");
    c.querySelector("h3").textContent = sc.title;
    c.querySelector("p").textContent = sc.caption + (src ? "\uff08" + src + "\uff09" : "");
    list.appendChild(c);
  });
}
})();
</script>
</body>
</html>
