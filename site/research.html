<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 研究室 · 有据问答</title>
<style>
:root{
  --paper:#f5efe0; --paper2:#efe6d0; --ink:#2b2420; --ink2:#5a4f45;
  --cinnabar:#b03a2e; --gold:#a8842c; --border:#d8cbaa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;padding:10px 16px;border-bottom:2px solid var(--cinnabar);display:flex;align-items:center;gap:14px;background:rgba(245,239,224,.97);position:sticky;top:0;z-index:10}
header h1{font-size:16px;letter-spacing:3px}
header .tag{font-size:11px;color:#fff;background:var(--gold);border-radius:9px;padding:2px 9px;letter-spacing:1px}
header a.back{margin-left:auto;font-size:12px;color:var(--cinnabar);text-decoration:none;border:1px solid var(--border);border-radius:13px;padding:4px 12px;background:rgba(255,252,243,.8)}
.wrap{width:min(860px,94vw);padding:26px 0 60px}
.note{font-size:12px;color:var(--ink2);line-height:1.9;background:rgba(255,252,243,.9);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:18px}
.note b{color:var(--cinnabar)}
.qbox{display:flex;gap:10px;margin-bottom:18px}
.qbox input{flex:1;font-family:inherit;font-size:14px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:rgba(255,252,243,.95);color:var(--ink);outline:none}
.qbox input:focus{border-color:var(--gold)}
.qbox button{font-family:inherit;font-size:14px;padding:10px 26px;border-radius:10px;border:1px solid var(--cinnabar);background:var(--cinnabar);color:#fff;cursor:pointer;letter-spacing:2px}
.qbox button:disabled{opacity:.5;cursor:wait}
.result{background:rgba(255,252,243,.95);border:1px solid var(--border);border-radius:10px;padding:18px 20px;display:none}
.result .model{font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:8px}
.result .answer{font-size:14.5px;line-height:2;letter-spacing:.5px;white-space:pre-wrap}
.result .insuff{font-size:14px;line-height:2;color:var(--gold)}
.result h4{font-size:13px;color:var(--cinnabar);letter-spacing:2px;margin:16px 0 8px}
.cit{border-left:3px solid var(--cinnabar);background:rgba(176,58,46,.04);border-radius:0 8px 8px 0;padding:8px 12px;margin-bottom:8px;font-size:12.5px;line-height:1.9}
.cit .id{color:var(--gold);font-size:11px}
.cit .q{color:var(--cinnabar)}
.cit a{color:var(--cinnabar);text-decoration:none;border-bottom:1px dashed var(--cinnabar)}
.err{background:rgba(176,58,46,.06);border:1px solid var(--cinnabar);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.9;color:#8e2f26;display:none}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.sugg button{font-family:inherit;font-size:12px;color:var(--ink2);background:rgba(255,252,243,.8);border:1px solid var(--border);border-radius:14px;padding:5px 14px;cursor:pointer}
.sugg button:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.footer{font-size:10.5px;color:var(--ink2);margin-top:16px;letter-spacing:.5px}
.scopeBar{display:flex;align-items:center;gap:12px;background:rgba(168,132,44,.08);border:1px solid var(--gold);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:12.5px;color:var(--ink2)}
.scopeBar b{color:var(--cinnabar)}
.scopeBar button,.scopeBar a{font-family:inherit;font-size:11.5px;color:var(--cinnabar);background:rgba(255,252,243,.8);border:1px solid var(--border);border-radius:12px;padding:3px 12px;cursor:pointer;text-decoration:none}
.scopeBar button:hover,.scopeBar a:hover{border-color:var(--cinnabar)}
.cardBtns{margin-top:14px;display:none}
.cardBtns button,.cardsHead button{font-family:inherit;font-size:12px;color:var(--ink2);background:rgba(255,252,243,.8);border:1px solid var(--border);border-radius:12px;padding:5px 14px;cursor:pointer}
.cardBtns button:hover,.cardsHead button:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.cards{margin-top:26px}
.cardsHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cardsHead h4{font-size:13px;color:var(--cinnabar);letter-spacing:2px}
.cardsHead span{font-size:11px;color:var(--ink2)}
.cardsHead button{margin-left:auto}
.cardsHead button + button{margin-left:0}
.rcard{background:rgba(255,252,243,.95);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;font-size:13px}
.rcard .cq{color:var(--ink);font-weight:bold;margin-bottom:6px}
.rcard .cmeta{font-size:10.5px;color:var(--gold);margin-bottom:6px}
.rcard .ca{line-height:1.9;white-space:pre-wrap;color:var(--ink)}
.rcard .ccits{margin-top:8px;font-size:11px;color:var(--cinnabar);line-height:1.8}
.rcard .cbtns{margin-top:10px;display:flex;gap:8px}
.rcard .cbtns button{font-family:inherit;font-size:11px;color:var(--ink2);background:rgba(245,239,224,.8);border:1px solid var(--border);border-radius:10px;padding:3px 10px;cursor:pointer}
.rcard .cbtns button:hover{border-color:var(--cinnabar);color:var(--cinnabar)}
.rcard .aiTag{display:inline-block;font-size:10px;color:#fff;background:var(--gold);border-radius:8px;padding:1px 8px;margin-left:6px;letter-spacing:1px}
.rcard textarea{width:100%;font-family:inherit;font-size:13px;line-height:1.9;border:1px solid var(--gold);border-radius:8px;padding:8px;background:#fffdf5;color:var(--ink);box-sizing:border-box}
/* A07: 服务状态提示（读者可见，不含配置细节） */
.aiBanner{font-size:13px;color:#8a3b2e;background:rgba(176,58,46,.07);border:1px solid rgba(176,58,46,.3);border-radius:10px;padding:12px 14px;margin:0 0 12px;line-height:1.9}
.aiBanner b{display:block;font-size:13.5px;margin-bottom:4px;color:#7d2f24}
/* P05.2 / P05.5: 缺口说明 · 下一步 · 纠错 */
font-size:13px;color:#8a3b2e;background:rgba(168,132,44,.1);border-left:3px solid var(--gold);
  padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;line-height:1.9}
.nextStep{font-size:13px;color:var(--ink2);background:rgba(90,79,69,.06);border-radius:8px;padding:10px 12px;
  margin-top:10px;line-height:1.95}
.flagBox{margin:12px 0;padding:12px 14px;border:1px dashed var(--border);border-radius:10px}
.fbHd{font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.fbRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fbRow button{font-family:inherit;font-size:12px;padding:4px 12px;border-radius:12px;cursor:pointer;
  border:1px solid var(--gold);background:transparent;color:var(--gold)}
.fbMeta{font-size:11px;color:var(--ink2)}
.cit .flag{font-family:inherit;font-size:11px;margin-left:8px;padding:1px 8px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(176,58,46,.45);background:transparent;color:var(--cinnabar)}
</style>
</head>
<body>
<header>
  <h1>AI 研究室 · 有据问答</h1><span class="tag">可问范围：两篇 · 832 段</span>
  <a class="back" href="index.html">← 返回图集</a>
</header>
<div class="wrap">
  <div class="note" id="note">
    答案只由《中国的红色政权为什么能够存在？》《井冈山的斗争》两篇原文支撑，每条引用都能点开核对到具体段落。
    范围之外的问题会直接回答<b>资料不足</b>，不编造。
  </div>
  <div class="scopeBar" id="scopeBar" style="display:none">
    <span id="scopeLabel"></span>
    <button id="scopeAll">改回全语料</button>
    <a id="scopeBack" style="display:none">← 返回</a>
  </div>
  <div class="aiBanner" id="aiBanner" style="display:none"></div>
  <div class="qbox">
    <input id="q" maxlength="300" placeholder="例如：红色政权为什么能够存在？">
    <button id="ask">提 问</button>
    <button id="cancel" style="display:none;background:#8e6a4f;border-color:#8e6a4f">取消等待</button>
  </div>
  <div class="sugg" id="sugg"></div>
  <div class="err" id="err"></div>
  <div class="result" id="result">
    <div class="model" id="model"></div>
    <div class="answer" id="answer"></div>
    <h4 id="citHead">引用段落（点击可查看原文）</h4>
    <div id="cits"></div>
    <div id="flagBox" class="flagBox" style="display:none"></div>
    <div class="cardBtns">
      <button id="saveCard">保存为研究卡</button>
    </div>
  </div>
  <div class="cards">
    <div class="cardsHead">
      <h4>我的研究卡 <span id="cardCnt"></span></h4>
      <button id="exportMd">导出 Markdown</button>
      <button id="clearCards">全部删除</button>
    </div>
    <div id="cardList"></div>
  </div>
  <div class="footer">答案基于两篇原文；引用可点开核对。研究卡保存在本机浏览器，可导出 Markdown。</div>
</div>
<script src="lib/mx-store.js"></script>
<script>
(function(){
"use strict";
function el(id){ return document.getElementById(id); }
/* ---------- WP08 联动: 研究范围 (URL: research.html?art=v1n03,v1n04&from=scene:sc_jgs_02) ---------- */
var ART_TITLES = { v1n03: "\u4e2d\u56fd\u7682\u7ea2\u8272\u653f\u6743\u4e3a\u4ec0\u4e48\u80fd\u591f\u5b58\u5728\uff1f", v1n04: "\u4e95\u5188\u5c71\u7684\u6597\u4e89" };
var scopeArt = [];
var scopeFrom = null;
var scopePara = null;          /* B05: 从正文"解释此段"带来的段落锚点 */
function anchorToEvidenceId(pid){
  /* pa-v1n03-033 → pv1n03-033（同一段号，两种 ID 的显式映射） */
  var m = /^pa-(v\d+n\d+)-(\d+)$/.exec(pid || "");
  return m ? "p" + m[1] + "-" + m[2] : null;
}
(function parseScope(){
  try{
    var u = new URLSearchParams(location.search);
    var paraRaw = u.get("para") || "";
    if(paraRaw){
      scopePara = anchorToEvidenceId(paraRaw);
      if(!scopePara){
        /* 已是证据 ID 形式则直接用；否则记原文提示，避免悄悄退回整篇 */
        scopePara = /^pv\d+n\d+-\d+$/.test(paraRaw) ? paraRaw : null;
      }
      if(!scopePara){
        var pe = document.getElementById("scopeParaWarn");
        if(pe) pe.style.display = "block";
      }
    }
    var a = u.get("art") || "";
    scopeArt = a.split(",").map(function(s){ return s.trim(); }).filter(function(s){ return ART_TITLES[s]; });
    scopeFrom = u.get("from") || null;   // e.g. scene:sc_jgs_02
  }catch(e){}
  if(scopeArt.length){
    el("scopeBar").style.display = "flex";
    el("scopeLabel").innerHTML = "";
    var b = document.createElement("b");
    b.textContent = scopeArt.map(function(x){ return "\u300a" + ART_TITLES[x] + "\u300b"; }).join("\u3001");
    el("scopeLabel").appendChild(document.createTextNode("\u7814\u7a76\u8303\u56f4\uff1a"));
    el("scopeLabel").appendChild(b);
    el("scopeLabel").appendChild(document.createTextNode("\uff08\u68c0\u7d22\u4ec5\u5728\u6b64\u8303\u56f4\u5185\u8fdb\u884c\uff09"));
  }
  /* P02.4: 来源感知返回 — 剧场已下线；从专题来则回专题，从原文来则回该篇，否则回首页 */
  if(scopeFrom){
    el("scopeBack").style.display = "";
    if(scopeFrom.indexOf("topic:") === 0){
      el("scopeBack").href = "index.html#/view/topic";
    } else if(scopeFrom.indexOf("art:") === 0){
      el("scopeBack").href = "index.html#/art/" + encodeURIComponent(scopeFrom.slice(4));
    } else if(scopeFrom.indexOf("scene:") === 0){
      el("scopeBack").href = "index.html#/view/topic";   /* 旧 scene 链接映射到专题 */
    } else {
      el("scopeBack").href = "index.html";
    }
  }
})();
el("scopeAll").onclick = function(){
  scopeArt = []; scopeFrom = null;
  el("scopeBar").style.display = "none";
};
var SUGG = [
  "\u7ea2\u8272\u653f\u6743\u4e3a\u4ec0\u4e48\u80fd\u591f\u5b58\u5728\uff1f",
  "\u516b\u6708\u5931\u8d25\u7684\u539f\u56e0\u548c\u6559\u8bad\u662f\u4ec0\u4e48\uff1f",
  "\u4e95\u5188\u5c71\u6839\u636e\u5730\u7684\u5730\u5f62\u4f18\u52bf\u6709\u54ea\u4e9b\uff1f",
  "\u571f\u5730\u95ee\u9898\u4e0a\u7684\u5206\u914d\u6807\u51c6\u662f\u4ec0\u4e48\uff1f"
];
SUGG.forEach(function(s){
  var b = document.createElement("button");
  b.textContent = s;
  b.onclick = function(){ el("q").value = s; ask(); };
  el("sugg").appendChild(b);
});
var busy = false;
var curReq = 0;           // 请求代次: 迟到的旧回答不得覆盖新请求的结果
var curAbort = null;      // 当前 fetch 的 AbortController (取消界面等待; 模型调用是否真正停止由服务端决定)
function setBusy(b){
  busy = b;
  el("ask").disabled = b;
  el("cancel").style.display = b ? "" : "none";
  if(b){ el("ask").textContent = "提问中…"; } else { el("ask").textContent = "提 问"; }
}
function ask(){
  if(busy) return;
  var q = el("q").value.trim();
  if(!q) return;
  var myReq = ++curReq;
  var ac = new AbortController();
  curAbort = ac;
  setBusy(true);
  el("err").style.display = "none";
  el("result").style.display = "none";
  el("answer").textContent = "思考中（模型通常需要 15~40 秒）……";
  el("result").style.display = "block";
  var reqBody = { question: q };
  if(scopePara){
    /* B05: 段落范围必须真正送到服务端（此前只发 articleIds，等于问整篇） */
    reqBody.scope = { mode: "paragraphs", paragraphIds: [scopePara] };
  } else if(scopeFrom && scopeFrom.indexOf("topic:") === 0){
    reqBody.scope = { topicId: scopeFrom.slice(6) };
  } else if(scopeArt.length){
    reqBody.scope = { articleIds: scopeArt };
  } else {
    reqBody.scope = { mode: "corpus" };                   /* 显式全语料，不依赖默认 */
  }
  fetch("api/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(reqBody),
    signal: ac.signal
  }).then(function(r){ return r.json().then(function(j){ return { status: r.status, j: j, rid: r.headers.get("X-Request-Id") }; }); })
  .then(function(o){
    if(myReq !== curReq) return;  // 旧请求迟到 → 丢弃
    var j = o.j;
    if(!j || !j.ok){
      el("result").style.display = "none";
      var rawMsg = (j && j.error && j.error.message) || ("HTTP " + o.status);
      var code = (j && j.error && j.error.code) || "";
      el("err").textContent = friendlyError(code, rawMsg) +
        " 问题已保留在输入框，可修改后重试" +
        (o.rid ? " · 请求号 " + o.rid + "（反馈时提供）" : "");
      el("err").style.display = "block";
      return;   /* 不自动清空问题：错误后仍可修改重试 */
    }
    var gov = j.governance || {};
    var scopeTxt = j.scopeResolved
      ? (j.scopeResolved.mode === "corpus" ? "全语料" :
         (j.scopeResolved.paragraphIds && j.scopeResolved.paragraphIds.length
            ? j.scopeResolved.paragraphIds.length + " 个段落"
            : (j.scopeResolved.articleIds || []).length + " 篇文章" +
              (j.scopeResolved.topicId ? "（专题 " + j.scopeResolved.topicId + "）" : "")))
      : "";
    el("model").textContent = (j.model || "") + " · " + (j.ms/1000).toFixed(1) + "s · AI归纳，仅供参考" +
      (scopeTxt ? " · 范围：" + scopeTxt : "") +
      (gov.rateLimitScope === "instance" ? " · 限流为单实例" : "");
    var st = j.status || (j.insufficient ? "insufficient" : "answered");
    lastRequest = { requestId: j.requestId || o.rid || null, model: j.model, status: st,
                    corpusVersion: j.corpusVersion, pipelineVersion: j.pipelineVersion,
                    promptVersion: j.promptVersion, scope: j.scopeResolved || null,
                    citations: j.citations || [], governance: gov, usage: j.usage || null };
    if(st === "insufficient"){
      el("answer").innerHTML = "<span class='insuff'>样本语料中没有足够证据回答这个问题（不猜测、不编页码）。</span>" +
        "<div class='nextStep'>可以这样继续：①换一种更贴近原文的说法再问；②先在原文中检索关键词，找到相关段落后带着段落来问；" +
        "③如果问题超出这两篇的范围，先把你的理解写成笔记保存下来。</div>";
      el("citHead").style.display = "none";
      el("cits").innerHTML = "";
      if(el("flagBox")) el("flagBox").style.display = "none";
      lastAnswer = null;
      el("saveCard").parentNode.style.display = "none";
      return;
    }
    el("citHead").style.display = "";
    var gap = "";
    var mNote = /按语：([\s\S]+)$/.exec(j.answer || "");
    if(st === "partial" && mNote) gap = mNote[1].trim();
    el("answer").textContent = (st === "partial" ? "【部分回答】" : "") + j.answer;
    lastAnswer = { question: q, answer: el("answer").textContent, status: st,
      model: j.model, citations: j.citations || [],
      corpusVer: j.corpusVersion || CORPUS_VER_FALLBACK,
      requestId: lastRequest.requestId, pipelineVer: j.pipelineVersion, promptVer: j.promptVersion,
      scope: j.scopeResolved || null };
    el("saveCard").parentNode.style.display = "block";   /* FIX01: CSS 默认 .cardBtns{display:none}，置 "" 会回落到 none → 按钮永不可见 */
    if(st === "partial" && gap){
      var gp = document.createElement("div");
      gp.className = "gapBox";
      gp.textContent = "缺口说明：" + gap;
      el("answer").parentNode.insertBefore(gp, el("citHead"));
    }
    var box = el("cits");
    box.innerHTML = "";
    (j.citations || []).forEach(function(c){
      var d = document.createElement("div");
      d.className = "cit";
      /* WP08 联动: 引用直达段落级深链 #/art/<articleId>/<paraId> + 返回研究室 */
      d.innerHTML = "<span class='id'></span><br><span class='q'></span><br><a href='index.html#/art/" + c.articleId + "/" + c.id + "'>\u6253\u5f00\u300a" + (c.articleTitle || c.articleId) + "\u300b\u5bf9\u5e94\u6bb5\u843d \u2192</a>" +
        "<button class='flag' data-cit='" + c.id + "'>引用不相关</button>";
      d.querySelector(".id").textContent = c.id;
      d.querySelector(".q").textContent = c.quote ? ("\u201c" + c.quote + "\u201d") : "";
      box.appendChild(d);
    });
    renderFlagBox(st);
    bindFlagButtons();
  })
  .catch(function(e){
    if(myReq !== curReq) return;
    el("result").style.display = "none";
    el("err").textContent = (e && e.name === "AbortError")
      ? "已取消本次等待。请注意：取消只停止本页等待，已发出的模型调用可能仍在服务端继续并计费，结果不会展示。"
      : "网络错误：" + e + " · 问题仍保留在输入框，可稍后重试";
    el("err").style.display = "block";
  })
  .finally(function(){ if(myReq === curReq) setBusy(false); });
}
el("ask").onclick = ask;
el("cancel").onclick = function(){
  if(curAbort) curAbort.abort();
};
el("q").addEventListener("keydown", function(ev){ if(ev.key === "Enter" && !busy) ask(); });

/* ---------- A07: 提问前先告知服务状态；关闭态不发出任何模型请求 ---------- */
var AI_STATE = { enabled: null, reason: "" };
function friendlyError(code, msg){
  var map = {
    provider_not_configured: "AI 服务尚未开放。阅读、摘录与书房都可正常使用。",
    budget_not_configured: "AI 问答还没有开放。阅读与笔记不受影响。",
    budget_exhausted: "本次试用额度已用完，AI 问答暂时关闭。阅读与笔记不受影响。",
    upstream_insufficient: "AI 服务额度暂时用完，已停止生成。阅读与笔记不受影响。",
    rate_limited: "提问过于频繁，请稍等一分钟再试。",
    upstream_rate_limited: "上游限流，请稍后重试。",
    upstream_timeout: "本次回答超时，未产生结果；已发出的调用仍可能计费。",
    citation_validation_failed: "模型输出未通过引用校验，已拦截，未展示任何未经核验的答案。",
    scope_invalid: "提问范围无效：" + (msg || "请回到原文重新选择段落。"),
    scope_empty: "所选范围内没有可检索的原文段落。",
    ai_unavailable: "AI 服务当前不可用。阅读与笔记不受影响。",
  };
  return map[code] || (msg || "请求未成功，请稍后重试。");
}
(function loadAiState(){
  fetch("api/status").then(function(r){ return r.json(); }).then(function(j){
    if(j && j.ok && j.ai){
      AI_STATE = j.ai;
    }
  }).catch(function(){}).then(function(){
    if(AI_STATE.enabled === false){
      var b = el("aiBanner");
      if(b){
        b.style.display = "block";
        b.innerHTML = "";
        var t = document.createElement("b"); t.textContent = "AI 问答暂未开放";
        b.appendChild(t);
        b.appendChild(document.createTextNode(AI_STATE.reason || "AI 服务当前不可用。"));
        var li = document.createElement("div");

        li.textContent = "仍可正常使用：经典研读 · 专题四步 · 摘录与笔记 · 我的书房 · 备份导出。已保存的历史研究卡可以查看与导出。";
        b.appendChild(li);
      }
      el("ask").disabled = true;
      el("ask").title = AI_STATE.reason || "";
      el("ask").textContent = "AI 暂未开放";
      var sug = el("sugg");
      if(sug) sug.style.opacity = "0.5";
    }
  });
})();

/* ---------- WP08: 本地研究卡 (localStorage, 无账号; 存储失败明确提示不假成功) ---------- */
var CARDS_KEY = "mx_research_cards";
var CORPUS_VER_FALLBACK = "sample-topic v1 (v1n03+v1n04, 832段, 2026-10) [前端回退值]";  // 服务端 corpusVersion 缺失时才用
var lastAnswer = null;   // 最近一次成功回答 (供保存)
var lastRequest = null;  // P05.5: 最近一次请求的版本追踪信息 (requestId/模型/语料/管线)

/* ---------- P05.5: 回答纠错 (引用不相关 / 结论无依据) ---------- */
function renderFlagBox(st){
  var box = el("flagBox");
  if(!box) return;
  box.innerHTML = "";
  if(!lastRequest || !lastRequest.requestId){ box.style.display = "none"; return; }
  box.style.display = "block";
  var h = document.createElement("div");
  h.className = "fbHd";
  h.textContent = "这条回答有问题吗？可以标出来（不会改动答案，只用于后续回归）";
  box.appendChild(h);
  var row = document.createElement("div");
  row.className = "fbRow";
  var b1 = document.createElement("button");
  b1.textContent = "结论无依据";
  b1.onclick = function(){ sendFlag("answer_unsupported", null); };
  row.appendChild(b1);
  var meta = document.createElement("span");
  meta.className = "fbMeta";
  meta.textContent = "请求号 " + lastRequest.requestId +
    (lastRequest.pipelineVersion ? " · 管线 " + lastRequest.pipelineVersion : "") +
    (lastRequest.corpusVersion ? " · 语料 " + String(lastRequest.corpusVersion).slice(0, 18) : "");
  row.appendChild(meta);
  box.appendChild(row);
}
function bindFlagButtons(){
  document.querySelectorAll("#cits .flag").forEach(function(b){
    b.onclick = function(){ sendFlag("citation_irrelevant", b.getAttribute("data-cit")); };
  });
}
function sendFlag(kind, citationId){
  if(!lastRequest || !lastRequest.requestId){ return; }
  var reason = "";
  try{ reason = (window.prompt("可以补充一句原因（可留空）：", "") || "").slice(0, 200); }catch(e){}
  var payload = {
    kind: kind, requestId: lastRequest.requestId, citationId: citationId || null, reason: reason,
    model: lastRequest.model, corpusVersion: lastRequest.corpusVersion,
    pipelineVersion: lastRequest.pipelineVersion, promptVersion: lastRequest.promptVersion,
    scope: lastRequest.scope ? lastRequest.scope.mode : null,
  };
  fetch("api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j && j.ok){
        alert("已记录，感谢反馈。" + (j.persisted ? "" : "（当前未配置持久化存储，反馈仅记录在服务日志中）"));
      } else {
        alert("反馈未记录：" + ((j && j.error && j.error.message) || "服务不可用"));
      }
    })
    .catch(function(e){ alert("反馈发送失败：" + e); });
}
/* ---------- A05/A06: 研究卡统一 schema（原始回答不可改）+ 删除可恢复 ----------
   字段: id, question, answerRaw(不可改), editedAnswer(可空), citations, model, status,
        corpusVersion, promptVersion, pipelineVersion, scope, requestId, createdAt, updatedAt,
        historyMissing(旧卡原文不可恢复时明确标注), ts(兼容旧字段) */
var cardsCorrupt = false;
function migrateCards(list){
  var changed = false;
  list.forEach(function(c){
    if(!c || typeof c !== "object") return;
    if(c.answerRaw === undefined){
      /* 旧卡：若此前已被改写，无法确定原始回答 → 标注缺失，而不是把改写当原文 */
      if(c.edited){ c.answerRaw = ""; c.historyMissing = true; }
      else { c.answerRaw = c.answer || ""; }
      changed = true;
    }
    if(c.editedAnswer === undefined){ c.editedAnswer = c.edited ? (c.answer || null) : null; changed = true; }
    if(!c.createdAt){ c.createdAt = c.ts || Date.now(); changed = true; }
    if(c.ts === undefined){ c.ts = c.createdAt; changed = true; }
    if(!c.updatedAt){ c.updatedAt = c.createdAt; changed = true; }
  });
  return changed;
}
function cardText(c){ return (c.editedAnswer != null && c.editedAnswer !== "") ? c.editedAnswer : (c.answerRaw || c.answer || ""); }
function loadCards(){
  var r = MXStore.read(CARDS_KEY, "array");
  cardsCorrupt = (r.status === "corrupt");
  var list = (r.status === "ok") ? (r.value || []) : [];
  if(migrateCards(list) && !cardsCorrupt) MXStore.write(CARDS_KEY, list);
  return list;
}
function saveCards(list){
  var w = MXStore.write(CARDS_KEY, list);
  if(!w.ok) alert("研究卡保存失败：" + w.error + "（原数据未改动）");
  return w.ok;
}
function updateCard(id, mutator){
  var out = MXStore.update(CARDS_KEY, "array", function(list){
    for(var i=0;i<list.length;i++){ if(list[i] && list[i].id === id) mutator(list[i]); }
    return list;
  });
  if(!out.ok) alert("研究卡未保存：" + (out.status === "corrupt" ? "本地数据损坏，已中止写入以保留原值" : out.error));
  return out.ok;
}
function renderCards(){
  var list = loadCards();
  el("cardCnt").textContent = list.length ? "(" + list.length + ")" : "";
  var box = el("cardList");
  box.innerHTML = "";
  if(cardsCorrupt){
    var warn = document.createElement("p");
    warn.style.cssText = "font-size:12px;color:#8a3b2e;line-height:1.8";
    warn.textContent = "本地研究卡数据读取失败（不等于没有卡片）。为避免覆盖，本页暂不允许改写或删除；请到书房复制原始内容后再处理。";
    box.appendChild(warn);
  }
  if(!list.length && !cardsCorrupt){
    var p = document.createElement("p");
    p.style.cssText = "font-size:12px;color:var(--ink2)";
    p.textContent = "还没有研究卡。提问后将答案保存到这里，可改写、删除（可从书房回收站恢复）、导出 Markdown。";
    box.appendChild(p);
    return;
  }
  list.forEach(function(c){
    var d = document.createElement("div");
    d.className = "rcard";
    var q = document.createElement("div"); q.className = "cq";
    q.textContent = "问：" + c.question;
    d.appendChild(q);
    var meta = document.createElement("div"); meta.className = "cmeta";
    var tag = document.createElement("span"); tag.className = "aiTag"; tag.textContent = "AI归纳";
    meta.textContent = new Date(c.createdAt || c.ts).toLocaleString() + " · " + (c.model || "?") +
      " · 语料 " + (c.corpusVersion || c.corpusVer || "?") +
      (c.pipelineVersion ? " · 管线 " + c.pipelineVersion : "") +
      (c.requestId ? " · " + c.requestId : "") +
      (c.editedAnswer ? " · 含人工改写" : "");
    meta.appendChild(tag);
    d.appendChild(meta);
    var a = document.createElement("div"); a.className = "ca";
    a.textContent = cardText(c);
    d.appendChild(a);
    if(c.historyMissing){
      var hm = document.createElement("div");
      hm.style.cssText = "font-size:11.5px;color:#8a3b2e;margin-top:4px";
      hm.textContent = "原始 AI 回答缺失（旧数据在改写时未保留副本），当前显示的是人工改写。";
      d.appendChild(hm);
    } else if(c.editedAnswer){
      var raw = document.createElement("details");
      raw.style.cssText = "margin-top:6px;font-size:12px;color:var(--ink2)";
      var sum = document.createElement("summary"); sum.textContent = "查看原始 AI 回答";
      raw.appendChild(sum);
      var rawBody = document.createElement("div");
      rawBody.style.cssText = "margin-top:6px;line-height:1.85";
      rawBody.textContent = c.answerRaw || "";
      raw.appendChild(rawBody);
      d.appendChild(raw);
    }
    if(c.citations && c.citations.length){
      var ci = document.createElement("div"); ci.className = "ccits";
      ci.textContent = "引用：" + c.citations.map(function(x){ return x.id + "（" + (x.quote || "") + "）"; }).join("；");
      d.appendChild(ci);
    }
    if(c.scope && c.scope.mode){
      var sc = document.createElement("div");
      sc.style.cssText = "font-size:11.5px;color:var(--ink2);margin-top:4px";
      sc.textContent = "提问范围：" + (c.scope.mode === "corpus" ? "全语料" :
        ((c.scope.paragraphIds && c.scope.paragraphIds.length) ? c.scope.paragraphIds.length + " 个段落" :
         ((c.scope.articleIds || []).length + " 篇文章" + (c.scope.topicId ? "（专题 " + c.scope.topicId + "）" : ""))));
      d.appendChild(sc);
    }
    var btns = document.createElement("div"); btns.className = "cbtns";
    var bEdit = document.createElement("button"); bEdit.textContent = "改写";
    var bDel = document.createElement("button"); bDel.textContent = "删除";
    if(cardsCorrupt){ bEdit.disabled = true; bDel.disabled = true; }
    btns.appendChild(bEdit); btns.appendChild(bDel);
    d.appendChild(btns);
    bEdit.onclick = function(){
      var ta = document.createElement("textarea");
      ta.rows = 6; ta.value = cardText(c);
      a.replaceWith(ta);
      var bSave = document.createElement("button"); bSave.textContent = "保存改写";
      var bCancel = document.createElement("button"); bCancel.textContent = "取消";
      bSave.onclick = function(){
        var ok = updateCard(c.id, function(card){
          card.editedAnswer = ta.value;
          card.edited = true;
          card.updatedAt = Date.now();
          if(card.answerRaw === undefined) card.answerRaw = "";
        });
        if(ok) renderCards();
      };
      bCancel.onclick = function(){ renderCards(); };
      btns.innerHTML = "";
      btns.appendChild(bSave); btns.appendChild(bCancel);
    };
    bDel.onclick = function(){
      if(!confirm("删除这张研究卡？删除后可在本站书房的回收站恢复。")) return;
      var out = MXStore.deleteWithTrash({ collKey: CARDS_KEY, kind: "card", id: c.id });
      if(!out.ok){ alert("删除失败：" + out.error + "（原卡片已保留）"); return; }
      renderCards();
    };
    box.appendChild(d);
  });
}
el("saveCard").onclick = function(){
  if(!lastAnswer){ return; }
  if(cardsCorrupt){
    alert("本地研究卡数据损坏，为保留原始内容已中止保存。请到书房复制原始内容后再处理。");
    return;
  }
  var now = Date.now();
  var card = {
    id: "rc" + now,
    question: lastAnswer.question,
    answerRaw: lastAnswer.answer,
    editedAnswer: null,
    citations: lastAnswer.citations || [],
    model: lastAnswer.model,
    status: lastAnswer.status,
    corpusVersion: lastAnswer.corpusVer || CORPUS_VER_FALLBACK,
    promptVersion: (lastRequest && lastRequest.promptVersion) || null,
    pipelineVersion: (lastRequest && lastRequest.pipelineVersion) || null,
    scope: (lastRequest && lastRequest.scope) || null,
    requestId: (lastRequest && lastRequest.requestId) || null,
    createdAt: now, updatedAt: now, ts: now, edited: false,
  };
  var out = MXStore.update(CARDS_KEY, "array", function(list){ return [card].concat(list); });
  if(out.ok){
    renderCards();
    el("saveCard").textContent = "已保存 ✓";
    setTimeout(function(){ el("saveCard").textContent = "保存为研究卡"; }, 1500);
  }else if(out.status === "corrupt"){
    alert("研究卡未保存：本地数据损坏，已中止写入以保留原值。");
  }else{
    alert("研究卡保存失败：" + (out.error || "本地存储不可用"));
  }
};
el("clearCards").onclick = function(){
  var list = loadCards();
  if(!list.length){ return; }
  if(!confirm("将 " + list.length + " 张研究卡移入书房回收站？可逐张恢复。")) return;
  var moved = 0, failed = 0;
  list.forEach(function(c){
    var o = MXStore.deleteWithTrash({ collKey: CARDS_KEY, kind: "card", id: c.id });
    if(o.ok) moved++; else failed++;
  });
  renderCards();
  if(failed) alert("已移入回收站 " + moved + " 张，" + failed + " 张失败（失败的原卡片仍在）。");
};
el("exportMd").onclick = function(){
  var list = loadCards();
  if(!list.length){ alert("还没有研究卡可导出。"); return; }
  var lines = ["# 我的研究卡（井冈山样本专题）", "", "语料：" + (loadCards().length && loadCards()[0].corpusVer ? loadCards()[0].corpusVer : CORPUS_VER_FALLBACK), ""];
  list.forEach(function(c, i){
    lines.push("## " + (i + 1) + ". " + c.question);
    lines.push("");
    lines.push("> " + new Date(c.ts).toLocaleString() + " · " + (c.model || "?") + (c.edited ? " · 已人工改写" : "") + " · AI归纳，仅供参考");
    lines.push("");
    lines.push(c.answer);
    if(c.citations && c.citations.length){
      lines.push("");
      c.citations.forEach(function(x){
        lines.push("- 引用 `" + x.id + "`：" + (x.quote || ""));
      });
    }
    lines.push("");
  });
  var md = lines.join(String.fromCharCode(10));
  var blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
  var a2 = document.createElement("a");
  a2.href = URL.createObjectURL(blob);
  a2.download = "研究卡_" + new Date().toISOString().slice(0, 10) + ".md";
  document.body.appendChild(a2);
  a2.click();
  setTimeout(function(){ URL.revokeObjectURL(a2.href); a2.remove(); }, 500);
};
renderCards();
})();
</script>
