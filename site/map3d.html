<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M0 小样 · 立体地形与示意路线（内部验证）</title>
<link rel="stylesheet" href="assets/maplibre-gl.css">
<style>
:root{
  --paper:#f5efe0; --paper2:#efe6d0; --ink:#2b2420; --ink2:#5a4f45;
  --cinnabar:#b03a2e; --gold:#a8842c; --border:#d8cbaa;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;display:flex;flex-direction:column}
header{flex:0 0 auto;padding:8px 16px;border-bottom:2px solid var(--cinnabar);display:flex;align-items:center;gap:14px;background:rgba(245,239,224,.97);z-index:10}
header h1{font-size:16px;letter-spacing:3px}
header .tag{font-size:11px;color:#fff;background:var(--gold);border-radius:9px;padding:2px 9px;letter-spacing:1px}
header .modes{margin-left:auto;display:flex;gap:6px}
header button{font-family:inherit;font-size:12px;padding:4px 12px;border-radius:13px;border:1px solid var(--border);background:rgba(255,252,243,.8);color:var(--ink2);cursor:pointer;letter-spacing:1px}
header button.on{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
main{flex:1 1 auto;position:relative}
#map{position:absolute;inset:0}
.panel{position:absolute;left:12px;top:12px;z-index:5;max-width:330px;background:rgba(255,252,243,.95);border:1px solid var(--border);border-radius:10px;padding:12px 15px;box-shadow:0 3px 14px rgba(60,45,30,.18)}
.panel h3{font-size:14px;color:var(--cinnabar);letter-spacing:2px;margin-bottom:6px}
.panel p{font-size:12px;line-height:1.8;color:var(--ink2);letter-spacing:.5px}
.panel .demo-note{margin-top:8px;font-size:11px;color:var(--gold);border-top:1px dashed var(--border);padding-top:6px}
.playbar{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;background:rgba(255,252,243,.95);border:1px solid var(--border);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 18px rgba(60,45,30,.18)}
.playbar button{font-family:inherit;font-size:12.5px;padding:4px 14px;border-radius:13px;border:1px solid var(--cinnabar);background:rgba(176,58,46,.06);color:var(--cinnabar);cursor:pointer;letter-spacing:1px}
.playbar button:hover{background:var(--cinnabar);color:#fff}
.playbar .st{font-size:12.5px;color:var(--ink);letter-spacing:1px}
.playbar .yr{margin-left:auto;font-size:15px;font-weight:700;color:var(--cinnabar);letter-spacing:1px}
#status{position:absolute;right:12px;top:12px;z-index:5;background:rgba(43,36,32,.9);color:#f5efe0;font-size:11.5px;border-radius:8px;padding:8px 12px;letter-spacing:.5px;line-height:1.7;max-width:250px}
.attn{position:absolute;right:12px;bottom:12px;z-index:5;font-size:10px;color:var(--ink2);background:rgba(245,239,224,.85);border-radius:6px;padding:4px 8px;letter-spacing:.5px}
html.dark #map{filter:brightness(.72) saturate(.6)}
html.dark .panel,html.dark .playbar{background:rgba(33,30,25,.95)}
</style>
</head>
<body>
<header>
  <h1>M0 · 立体地形与示意路线小样</h1><span class="tag">内部验证 · 未核定史实</span>
  <div class="modes">
    <button id="m3d" class="on">三维地形</button>
    <button id="m2d">二维</button>
    <button id="mOverview">全国概览</button>
    <button id="mRegion">地区近景</button>
  </div>
</header>
<main>
  <div id="map"></div>
  <div class="panel">
    <h3>井冈山地区 · 地形贴合验证</h3>
    <p>演示内容：MapLibre GL + 真实DEM（terrarium高程瓦片）山地起伏；示意虚线路线与停驻节点。</p>
    <p class="demo-note">虚线＝主要停驻地顺序示意，非精确行军道路。节点坐标与顺序沿自现有ROUTE数据，属候选基线，未经史实审校。日期精度以年/约年表达。</p>
  </div>
  <div class="playbar">
    <button id="playBtn">▶ 播放导览</button>
    <span class="st" id="stationLab">瑞金（1931·约）</span>
    <span class="yr" id="yearLab">1931</span>
  </div>
  <div id="status">加载中…</div>
  <div class="attn">DEM: AWS Terrain Tiles (Mapzen terrarium, 公开) · 底图: CARTO basemaps (© OpenStreetMap contributors)</div>
</main>
<script src="assets/maplibre-gl.js"></script>
<script>
/* M0 sample - ASCII only. Route segment: Ruijin -> Wakampao -> Baoan -> Yanan (approx). */
(function(){
"use strict";
var STATIONS = [
  {name:"瑞金", lng:116.03, lat:25.88, year:1931, label:"1931·约", ev:"中华苏维埃共和国临时中央政府成立地"},
  {name:"遵义", lng:106.93, lat:27.70, year:1935, label:"1935·约", ev:"遵义会议（原路线未含此站，M0仅示意）"},
  {name:"瓦窑堡", lng:109.67, lat:37.14, year:1935, label:"1935年末", ev:"瓦窑堡会议"},
  {name:"保安", lng:108.77, lat:36.82, year:1936, label:"1936·约", ev:"中共中央驻地为保安（今志丹）"},
  {name:"延安", lng:109.49, lat:36.60, year:1937, label:"1937·约", ev:"中共中央进驻延安"}
];
var DEM_URL = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
var BASE_URL = "https://basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png";
var LABEL_URL = "https://basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png";
var st = document.getElementById("status");
function log(s){ st.textContent = s; }
log("初始化…");
var map = new maplibregl.Map({
  container:"map",
  style:{
    version:8,
    glyphs:"https://fonts.openmaptiles.org/{fontstack}/{range}.pbf",
    sources:{
      base:{type:"raster", tiles:[BASE_URL], tileSize:256, maxzoom:19,
        attribution:"© OpenStreetMap contributors © CARTO"},
      labels:{type:"raster", tiles:[LABEL_URL], tileSize:256, maxzoom:19},
      dem:{type:"raster-dem", tiles:[DEM_URL], encoding:"terrarium", tileSize:256, maxzoom:13}
    },
    layers:[
      {id:"base", type:"raster", source:"base", paint:{"raster-opacity":0.92}},
      {id:"dem-shade", type:"hillshade", source:"dem", paint:{
        "hillshade-exaggeration":0.45, "hillshade-shadow-color":"#6b5d3f",
        "hillshade-highlight-color":"#fff8e8", "hillshade-accent-color":"#c9b98d"}},
      {id:"labels", type:"raster", source:"labels", paint:{"raster-opacity":0.85}}
    ]
  },
  center:[108.8, 34.5], zoom:5.2, pitch:52, bearing:-24,
  maxZoom:12, attributionControl:{compact:true}
});
window.__map = map;   /* test hook: window.map is shadowed by the div#map element */
map.on("error", function(e){ log("地图错误: " + (e && e.error && e.error.message || "unknown")); });
map.on("load", function(){
  log("底图+DEM 已加载（三维模式）");
  /* route dashed line + stops (GeoJSON lng/lat order!) */
  var coords = STATIONS.map(function(s){ return [s.lng, s.lat]; });
  map.addSource("route", {type:"geojson", data:{
    type:"FeatureCollection", features:[
      {type:"Feature", properties:{}, geometry:{type:"LineString", coordinates:coords}}
    ]
  }});
  map.addLayer({id:"route-line", type:"line", source:"route", paint:{
    "line-color":"#b03a2e", "line-width":3.2, "line-dasharray":[2.5,2]
  }, layout:{"line-cap":"round"}});
  map.addSource("stops", {type:"geojson", data:{
    type:"FeatureCollection",
    features:STATIONS.map(function(s, i){
      return {type:"Feature", properties:{name:s.name, year:s.year, label:s.label, ev:s.ev, idx:i},
        geometry:{type:"Point", coordinates:[s.lng, s.lat]}};
    })
  }});
  map.addLayer({id:"stop-halo", type:"circle", source:"stops", paint:{
    "circle-radius":11, "circle-color":"rgba(176,58,46,.25)", "circle-stroke-width":2, "circle-stroke-color":"#b03a2e"
  }});
  map.addLayer({id:"stop-core", type:"circle", source:"stops", paint:{
    "circle-radius":5, "circle-color":"#f5efe0", "circle-stroke-width":2.5, "circle-stroke-color":"#8e2f26"
  }});
  map.addLayer({id:"stop-label", type:"symbol", source:"stops", layout:{
    "text-field":["get","name"], "text-font":["Noto Sans CJK JP"],
    "text-size":13, "text-offset":[0,1.4], "text-anchor":"top",
    "text-allow-overlap":false
  }, paint:{"text-color":"#3a322a", "text-halo-color":"#f5efe0", "text-halo-width":1.6}});
  /* click stop -> panel update */
  map.on("click", "stop-core", function(e){
    var p = e.features[0].properties;
    document.getElementById("stationLab").textContent = p.name + "（" + p.label + "）";
    document.getElementById("yearLab").textContent = p.year;
    map.flyTo({center:e.features[0].geometry.coordinates, zoom:9.5, pitch:58, duration:1600});
  });
  log("路线与节点就绪 · 点节点看近景");
});

/* mode buttons */
document.getElementById("m3d").onclick = function(){
  map.setPitch(52); this.classList.add("on"); document.getElementById("m2d").classList.remove("on");
  if(map.getSource("dem")) map.setTerrain({source:"dem", exaggeration:1.0});
  log("三维地形开启（1.0倍率，无夸张）");
};
document.getElementById("m2d").onclick = function(){
  map.setPitch(0); this.classList.add("on"); document.getElementById("m3d").classList.remove("on");
  map.setTerrain(null);
  log("二维模式（地形已禁用）");
};
document.getElementById("mOverview").onclick = function(){
  map.flyTo({center:[112,32], zoom:4.2, pitch:28, bearing:0, duration:2200});
  log("全国概览视角");
};
document.getElementById("mRegion").onclick = function(){
  map.flyTo({center:[109.49,36.6], zoom:9.8, pitch:55, bearing:-18, duration:2200});
  log("延安地区近景（受DEM z13精度限制）");
};
/* enable terrain after style load */
map.on("load", function(){ map.setTerrain({source:"dem", exaggeration:1.0}); });

/* station tour player */
var playing = false, timer = null, idx = 0;
document.getElementById("playBtn").onclick = function(){
  playing = !playing;
  this.textContent = playing ? "❚❚ 暂停" : "▶ 播放导览";
  if(playing) step(); else { clearTimeout(timer); }
};
function step(){
  if(!playing) return;
  var s = STATIONS[idx];
  document.getElementById("stationLab").textContent = s.name + "（" + s.label + "）";
  document.getElementById("yearLab").textContent = s.year;
  map.flyTo({center:[s.lng, s.lat], zoom:8.6, pitch:55, bearing:-20, duration:2400});
  idx = (idx + 1) % STATIONS.length;
  timer = setTimeout(step, 3400);
}
/* pause on user interaction (M18 direction) */
map.on("dragstart", function(){ if(playing){ playing=false; document.getElementById("playBtn").textContent="▶ 播放导览"; clearTimeout(timer); } });
})();
</script>
</body>
</html>
