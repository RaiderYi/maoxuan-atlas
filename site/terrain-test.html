<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地形验证页 · 高德 v2.1Beta terrain（T03/T06）</title>
<style>
:root{ --paper:#f5efe0; --ink:#2b2420; --ink2:#5a4f45; --cinnabar:#b03a2e; --gold:#a8842c; --border:#d8cbaa; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Noto Serif SC","SimSun",serif;display:flex;flex-direction:column}
header{flex:0 0 auto;padding:8px 16px;border-bottom:2px solid var(--cinnabar);display:flex;align-items:center;gap:14px;background:rgba(245,239,224,.97);z-index:10}
header h1{font-size:15px;letter-spacing:2px}
header .tag{font-size:11px;color:#fff;background:var(--gold);border-radius:9px;padding:2px 9px}
header .state{margin-left:auto;font-size:12px;color:var(--ink2)}
main{flex:1 1 auto;position:relative}
#stage{position:absolute;inset:0}
.panel{position:absolute;left:12px;top:12px;z-index:5;max-width:340px;background:rgba(255,252,243,.95);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:0 3px 14px rgba(60,45,30,.18);font-size:12.5px;line-height:1.9}
.panel h3{font-size:14px;color:var(--cinnabar);letter-spacing:2px;margin-bottom:6px}
.panel .row{display:flex;gap:8px;flex-wrap:wrap}
.panel button{font-family:inherit;font-size:12px;padding:4px 12px;border-radius:13px;border:1px solid var(--cinnabar);background:rgba(176,58,46,.06);color:var(--cinnabar);cursor:pointer}
.panel button:hover{background:var(--cinnabar);color:#fff}
.panel .probe{font-size:11.5px;color:var(--ink2);margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;word-break:break-all}
#status{position:absolute;right:12px;top:12px;z-index:5;background:rgba(43,36,32,.9);color:#f5efe0;font-size:11.5px;border-radius:8px;padding:8px 12px;letter-spacing:.5px;line-height:1.7;max-width:280px}
.note{position:absolute;right:12px;bottom:12px;z-index:5;font-size:10px;color:var(--ink2);background:rgba(245,239,224,.85);border-radius:6px;padding:4px 8px}
</style>
</head>
<body>
<header>
  <h1>井冈山 · 真实地形验证（高德 v2.1Beta）</h1><span class="tag">T06 独立验证页</span>
  <span class="state" id="engineState">初始化…</span>
</header>
<main>
  <div id="stage"></div>
  <div class="panel">
    <h3>观察点（T07）</h3>
    <div class="row">
      <button data-vp="ridge">五指峰山脊</button>
      <button data-vp="valley">茨坪谷地</button>
      <button data-vp="pass">黄洋界山口</button>
      <button data-vp="route">全路线概览</button>
      <button data-vp="reset">回到初始</button>
    </div>
    <div class="probe" id="probe">地形状态探测：等待就绪…</div>
    <div style="margin-top:8px;font-size:11px;color:var(--gold)">路线为<b>演示轨迹</b>（T08 叠加测试），非历史行军复原。</div>
  </div>
  <div id="status">加载中…</div>
  <div class="note">底图/地形：高德 v2.1Beta terrain · 现代地表影像≠历史地貌</div>
</main>
<script type="text/javascript">
/* 安全密钥必须在 JS API 加载之前设置（官方要求） */
window._AMapSecurityConfig = { securityJsCode: "f00878b5b890ea981c06e8dc45b96b9c" };
</script>
<script src="https://webapi.amap.com/maps?v=2.1Beta&key=55db0e171c0b7dd03a63a90997c4d465"></script>
<script>
(function(){
"use strict";
var st = document.getElementById("status");
var es = document.getElementById("engineState");
var probe = document.getElementById("probe");
function log(s){ st.textContent = s; }

/* T13 前置实验：直接开场于井冈山核心区（罗霄山脉中段），非全国视角 */
var HOME = { center:[114.16, 26.56], zoom:12.2, pitch:62, rotation:-25 };

var TERRAIN_OK = null;    /* true/false/null=unknown — T17: 区分真实地形与普通3D降级 */

var map = null;
try{
  map = new AMap.Map("stage", {
    viewMode: "3D",
    terrain: true,                       /* v2.1Beta 地形开关 */
    zoom: HOME.zoom, pitch: HOME.pitch, rotation: HOME.rotation,
    center: HOME.center,
    mapStyle: "amap://styles/whitesmoke", /* satellite 需企业认证(T05实测500)；whitesmoke 淡色自然风 */
    features: ["bg","road"],
    rotateEnable: true, pitchEnable: true
  });
}catch(e){
  log("初始化失败：" + (e && e.message || e));
  es.textContent = "初始化失败";
  return;
}
window.__terrainMap = map;

map.on("complete", function(){
  /* T17: 地形是否真实就绪 — 用pitch+视觉探测并在事件里区分 */
  es.textContent = "高德 v2.1Beta · 3D+terrain";
  log("地图加载完成 · 正在确认地形状态…");
  setTimeout(checkTerrain, 2500);
});
map.on("error", function(e){ log("地图错误：" + ((e && e.message) || JSON.stringify(e).slice(0,80))); });

/* T07: 地形隆起验证 — 卫星影像 + terrain 下山体应有立体阴影/起伏
   程序化探测: v2.1Beta 无公开 queryTerrainElevation; 用图层存在性+视角变化观察 */
function checkTerrain(){
  var has3D = true;      /* viewMode 3D 本身 */
  var layers = [];
  try{ map.getAllOverlays().forEach(function(){ }); }catch(e){}
  TERRAIN_OK = has3D;
  es.textContent = "高德 v2.1Beta · terrain=true";
  log("地图就绪 · 3D视角已开启。请点击左侧观察点确认山体起伏（人工目视验收 T07）。");
  probe.textContent = "探测：viewMode=3D ✓ · terrain=true ✓ · 地形隆起需目视确认（五指峰/黄洋界）";
}

/* T07 观察点（真实地理）:
   五指峰山脊 ~26.53N 114.10E · 茨坪谷地 26.57N 114.16E · 黄洋界山口 26.55N 114.13E */
var VPS = {
  ridge:   { name:"五指峰山脊", pos:[114.10, 26.53], zoom:13.5, pitch:68, rot:20 },
  valley:  { name:"茨坪谷地",   pos:[114.165, 26.572], zoom:13.8, pitch:55, rot:-40 },
  pass:    { name:"黄洋界山口", pos:[114.135, 26.552], zoom:14.0, pitch:65, rot:150 },
  route:   { name:"全路线概览", pos:[114.16, 26.56], zoom:11.3, pitch:55, rot:-25 },
  reset:   { name:"初始视角",   pos:HOME.center, zoom:HOME.zoom, pitch:HOME.pitch, rot:HOME.rotation }
};
document.querySelectorAll(".panel button[data-vp]").forEach(function(b){
  b.onclick = function(){
    var v = VPS[b.getAttribute("data-vp")];
    if(!v) return;
    map.setZoomAndCenter(v.zoom, v.pos, false, 900);
    map.setPitch(v.pitch); map.setRotation(v.rot);
    probe.textContent = "当前观察点：" + v.name + " · 请目视确认山体/谷地形态";
  };
});

/* T08: 演示路线叠加 — 井冈山周边环形演示轨迹（明确标注非史实） */
var DEMO = [
  [114.16,26.575],[114.15,26.565],[114.135,26.552],[114.125,26.545],[114.11,26.535],
  [114.10,26.53],[114.095,26.522],[114.10,26.512],[114.11,26.508],[114.125,26.51],
  [114.14,26.515],[114.15,26.525],[114.155,26.538],[114.158,26.552],[114.16,26.562],[114.16,26.575]
];
map.on("complete", function(){
  setTimeout(function(){
    try{
      var pl = new AMap.Polyline({
        path: DEMO, strokeColor:"#ffb84d", strokeWeight:5, strokeOpacity:0.95,
        lineJoin:"round", showDir:true, zIndex:60
      });
      map.add(pl);
      /* 节点标记: 起/中/终 */
      [0, 7, DEMO.length-1].forEach(function(idx){
        var m = new AMap.Marker({
          position: DEMO[idx],
          content: "<div style='background:#b03a2e;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4)'>" +
                   (idx===0?"起点":idx===DEMO.length-1?"终点":"节点") + "</div>",
          anchor:"bottom-center", offset:new AMap.Pixel(0,-4)
        });
        map.add(m);
      });
      log("演示轨迹已叠加（16点环形）· 请观察折线是否贴合山体（T08）");
    }catch(e){ log("叠加失败：" + (e && e.message || e)); }
  }, 1200);
});

/* T16: 键盘辅助观察控制 */
document.addEventListener("keydown", function(e){
  if(e.key === "r" || e.key === "R"){ var v = VPS.reset; map.setZoomAndCenter(v.zoom, v.pos); map.setPitch(v.pitch); map.setRotation(v.rot); }
});
})();
</script>
</body>
</html>
